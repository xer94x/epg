<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPTV Player — Web</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.15/hls.min.js"></script>
<style>
  :root{
    --bg:        #10141a;
    --panel:     #171d26;
    --panel-2:   #1d2531;
    --line:      #2a3341;
    --text:      #e9ebee;
    --text-dim:  #8b95a5;
    --amber:     #f0a83c;
    --amber-dim: #7a5a2a;
    --cyan:      #4fb8c4;
    --red-live:  #e6483f;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --sans: 'Inter', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    overflow:hidden;
  }

  .app{
    display:grid;
    grid-template-columns: 340px 1fr;
    height:100vh;
  }

  /* ── sidebar ─────────────────────────────────────────────────────── */
  .sidebar{
    background:var(--panel);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .sidebar-head{
    padding:16px 16px 12px;
    border-bottom:1px solid var(--line);
  }
  .brand{
    font-family:var(--mono);
    font-weight:700;
    font-size:13px;
    letter-spacing:.14em;
    color:var(--text-dim);
    text-transform:uppercase;
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:12px;
  }
  .brand .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--amber);
    box-shadow:0 0 6px var(--amber);
  }
  .playlist-controls{display:flex; flex-direction:column; gap:6px;}
  .row{display:flex; gap:6px;}
  input[type=text]{
    flex:1;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    padding:8px 10px;
    border-radius:4px;
    font-family:var(--sans);
    font-size:12.5px;
    min-width:0;
  }
  input[type=text]:focus{outline:1px solid var(--amber); border-color:var(--amber);}
  button{
    font-family:var(--mono);
    font-size:11.5px;
    font-weight:600;
    letter-spacing:.04em;
    text-transform:uppercase;
    border-radius:4px;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--text);
    padding:8px 12px;
    cursor:pointer;
    transition:border-color .12s, color .12s;
  }
  button:hover{border-color:var(--amber); color:var(--amber);}
  button:focus-visible{outline:2px solid var(--amber); outline-offset:1px;}
  button.primary{
    background:var(--amber);
    color:#1a1206;
    border-color:var(--amber);
  }
  button.primary:hover{background:#f5b859; color:#1a1206;}
  .file-btn{position:relative; overflow:hidden;}
  .file-btn input[type=file]{
    position:absolute; inset:0; opacity:0; cursor:pointer;
  }
  .hint{font-size:11px; color:var(--text-dim); margin-top:2px; font-family:var(--mono);}

  .search-box{padding:10px 16px; border-bottom:1px solid var(--line);}
  .search-box input{width:100%;}

  .groups{flex:1; overflow-y:auto; min-height:0;}
  .group{border-bottom:1px solid var(--line);}
  .group-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 16px;
    cursor:pointer;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--text-dim);
    background:var(--panel);
    position:sticky; top:0; z-index:1;
  }
  .group-head:hover{color:var(--text);}
  .group-head .count{color:var(--text-dim); font-weight:400;}
  .group-body{display:none;}
  .group.open .group-body{display:block;}
  .group.open .chevron{transform:rotate(90deg);}
  .chevron{transition:transform .12s; font-size:10px;}

  .channel{
    display:flex; align-items:center; gap:10px;
    padding:8px 16px 8px 22px;
    cursor:pointer;
    border-left:2px solid transparent;
  }
  .channel:hover{background:var(--panel-2);}
  .channel.active{
    background:var(--panel-2);
    border-left-color:var(--amber);
  }
  .channel.active .ch-name{color:var(--amber);}
  .ch-logo{
    width:26px; height:26px;
    border-radius:4px;
    background:var(--panel-2);
    object-fit:contain;
    flex-shrink:0;
    border:1px solid var(--line);
  }
  .ch-name{
    font-size:12.5px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    flex:1;
  }
  .empty-state{
    padding:40px 20px;
    text-align:center;
    color:var(--text-dim);
    font-family:var(--mono);
    font-size:12px;
    line-height:1.7;
  }

  /* ── main / player ───────────────────────────────────────────────── */
  .main{
    display:flex; flex-direction:column;
    min-width:0; min-height:0;
    background:#000;
  }
  .topbar{
    display:flex; align-items:center; gap:12px;
    padding:12px 20px;
    background:var(--panel);
    border-bottom:1px solid var(--line);
  }
  .live-tag{
    font-family:var(--mono);
    font-size:10.5px; font-weight:700;
    letter-spacing:.08em;
    color:#fff;
    background:var(--red-live);
    padding:3px 7px;
    border-radius:3px;
    display:flex; align-items:center; gap:5px;
    visibility:hidden;
  }
  .live-tag.on{visibility:visible;}
  .live-tag .pulse{
    width:6px;height:6px;border-radius:50%;
    background:#fff;
    animation:pulse 1.4s infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .now-playing{
    font-family:var(--mono);
    font-size:13.5px;
    font-weight:600;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .now-playing.dim{color:var(--text-dim); font-weight:400;}
  .topbar-right{margin-left:auto; display:flex; align-items:center; gap:10px;}
  .status-pill{
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--text-dim);
    border:1px solid var(--line);
    padding:3px 8px;
    border-radius:3px;
  }

  .video-wrap{
    flex:1;
    position:relative;
    min-height:0;
    background:#000;
  }
  video{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:contain;
    background:#000;
  }
  .placeholder{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    color:var(--text-dim);
    font-family:var(--mono);
    font-size:12px;
    text-align:center;
  }
  .overlay-msg{
    position:absolute; inset:0;
    display:none;
    align-items:center; justify-content:center;
    background:rgba(10,12,16,.82);
    font-family:var(--mono);
    font-size:12.5px;
    color:var(--amber);
    text-align:center;
    padding:20px;
  }
  .overlay-msg.show{display:flex;}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}
  ::-webkit-scrollbar-track{background:transparent;}

  @media (max-width: 760px){
    .app{grid-template-columns: 1fr;}
    .sidebar{
      position:fixed; z-index:20; top:4px; bottom:0; left:0; width:82vw; max-width:340px;
      transform:translateX(-100%);
      transition:transform .18s ease;
    }
    .sidebar.open{transform:translateX(0);}
    .menu-btn{display:inline-flex !important;}
  }
  .menu-btn{display:none;}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="brand"><span class="dot"></span> IPTV · Console</div>
      <div class="playlist-controls">
        <div class="row">
          <input type="text" id="m3uUrl" placeholder="URL playlist .m3u / .m3u8">
          <button id="loadUrlBtn">Carica</button>
        </div>
        <div class="row">
          <button class="file-btn" style="flex:1">
            File locale…
            <input type="file" id="m3uFile" accept=".m3u,.m3u8,text/plain">
          </button>
        </div>
      </div>
      <div class="hint" id="playlistHint">Nessuna playlist caricata</div>
    </div>
    <div class="search-box">
      <input type="text" id="search" placeholder="Cerca canale…">
    </div>
    <div class="groups" id="groups">
      <div class="empty-state">Carica una playlist M3U (URL o file)<br>per vedere i canali qui.</div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn" title="Canali">☰</button>
      <span class="live-tag" id="liveTag"><span class="pulse"></span>ON AIR</span>
      <span class="now-playing dim" id="nowPlaying">Nessun canale selezionato</span>
      <div class="topbar-right">
        <span class="status-pill" id="statusPill">STANDBY</span>
      </div>
    </div>
    <div class="video-wrap">
      <video id="video" controls playsinline></video>
      <div class="placeholder" id="placeholder">
        <div>NESSUN SEGNALE — seleziona un canale dalla lista</div>
      </div>
      <div class="overlay-msg" id="overlayMsg"></div>
    </div>
  </main>
</div>

<script>
(function(){
  "use strict";

  const els = {
    video: document.getElementById('video'),
    placeholder: document.getElementById('placeholder'),
    overlay: document.getElementById('overlayMsg'),
    groups: document.getElementById('groups'),
    search: document.getElementById('search'),
    m3uUrl: document.getElementById('m3uUrl'),
    loadUrlBtn: document.getElementById('loadUrlBtn'),
    m3uFile: document.getElementById('m3uFile'),
    playlistHint: document.getElementById('playlistHint'),
    nowPlaying: document.getElementById('nowPlaying'),
    liveTag: document.getElementById('liveTag'),
    statusPill: document.getElementById('statusPill'),
    sidebar: document.getElementById('sidebar'),
    menuBtn: document.getElementById('menuBtn'),
  };

  let channels = [];        // { name, url, logo, group, tvgId }
  let activeChannel = null;
  let hls = null;
  let openGroup = null;   // nome del gruppo attualmente espanso (solo uno alla volta)

  // ── Parsing M3U (stessa logica dell'app Python: EXTINF + attributi) ──
  function parseM3U(content){
    const lines = content.split(/\r?\n/);
    const result = [];
    let pending = null;

    for (let raw of lines){
      const line = raw.trim();
      if (!line) continue;

      if (line.startsWith('#EXTINF')){
        const info = line.substring(line.indexOf(':') + 1);
        const logoMatch  = info.match(/tvg-logo="([^"]*)"/i);
        const groupMatch = info.match(/group-title="([^"]*)"/i);
        const idMatch    = info.match(/tvg-id="([^"]*)"/i);
        const nameMatch  = info.match(/,(.*)$/);
        pending = {
          name: nameMatch ? nameMatch[1].trim() : 'Canale',
          logo: logoMatch ? logoMatch[1] : '',
          group: groupMatch ? groupMatch[1] : 'Senza categoria',
          tvgId: idMatch ? idMatch[1] : '',
        };
      } else if (line.startsWith('#')){
        continue; // altre direttive (#EXTM3U, #EXTVLCOPT, ecc.) ignorate
      } else {
        // riga URL
        if (pending){
          pending.url = line;
          result.push(pending);
          pending = null;
        }
      }
    }
    return result;
  }

  function groupChannels(list){
    const map = new Map();
    for (const ch of list){
      if (!map.has(ch.group)) map.set(ch.group, []);
      map.get(ch.group).push(ch);
    }
    return map;
  }

  function renderChannels(filterText){
    const filter = (filterText || '').trim().toLowerCase();
    const filtered = filter
      ? channels.filter(c => c.name.toLowerCase().includes(filter))
      : channels;

    if (!filtered.length){
      els.groups.innerHTML = `<div class="empty-state">${channels.length ? 'Nessun canale trovato.' : 'Carica una playlist M3U (URL o file)<br>per vedere i canali qui.'}</div>`;
      return;
    }

    const grouped = groupChannels(filtered);
    const frag = document.createDocumentFragment();

    for (const [groupName, chans] of grouped){
      const isOpen = filter ? true : openGroup === groupName;
      const groupEl = document.createElement('div');
      groupEl.className = 'group' + (isOpen ? ' open' : '');

      const head = document.createElement('div');
      head.className = 'group-head';
      head.innerHTML = `<span><span class="chevron">▶</span> ${escapeHtml(groupName)}</span><span class="count">${chans.length}</span>`;
      head.addEventListener('click', () => {
        if (filter) return; // durante la ricerca i gruppi restano tutti aperti
        openGroup = (openGroup === groupName) ? null : groupName;
        renderChannels(els.search.value);
      });

      const body = document.createElement('div');
      body.className = 'group-body';

      for (const ch of chans){
        const item = document.createElement('div');
        item.className = 'channel' + (activeChannel === ch ? ' active' : '');
        item.innerHTML = `
          <img class="ch-logo" src="${escapeAttr(ch.logo)}" alt=""
               onerror="this.style.visibility='hidden'">
          <span class="ch-name">${escapeHtml(ch.name)}</span>`;
        item.addEventListener('click', () => playChannel(ch));
        body.appendChild(item);
      }

      groupEl.appendChild(head);
      groupEl.appendChild(body);
      frag.appendChild(groupEl);
    }

    els.groups.innerHTML = '';
    els.groups.appendChild(frag);
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
  function escapeAttr(s){ return escapeHtml(s || ''); }

  // ── Proxy CORS automatici (nessuna configurazione richiesta) ──────
  // Provati in ordine solo se il fetch diretto fallisce per CORS/rete.
  const CORS_PROXIES = [
    u => 'https://corsproxy.io/?url=' + encodeURIComponent(u),
    u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
    u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u),
  ];

  // Prova l'URL diretto, poi i proxy in cascata. Restituisce { text, viaProxy }.
  async function fetchWithFallback(url, onStatus){
    try{
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return { text: await res.text(), viaProxy: false };
    }catch(directErr){
      for (let i = 0; i < CORS_PROXIES.length; i++){
        if (onStatus) onStatus(`Fetch diretto fallito, provo proxy ${i + 1}/${CORS_PROXIES.length}…`);
        try{
          const res = await fetch(CORS_PROXIES[i](url), { cache: 'no-store' });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const text = await res.text();
          if (!text || !text.trim()) throw new Error('risposta vuota');
          return { text, viaProxy: true };
        }catch(e){ /* prova il prossimo proxy */ }
      }
      throw directErr;
    }
  }

  // ── Caricamento playlist ─────────────────────────────────────────
  async function loadFromUrl(url){
    setHint('Caricamento playlist…');
    try{
      const { text } = await fetchWithFallback(url, setHint);
      applyPlaylist(text, url);
    }catch(err){
      setHint('Errore caricamento: ' + err.message);
    }
  }

  function loadFromFile(file){
    setHint('Lettura file…');
    const reader = new FileReader();
    reader.onload = () => applyPlaylist(reader.result, file.name);
    reader.onerror = () => setHint('Errore lettura file.');
    reader.readAsText(file);
  }

  function applyPlaylist(text, sourceLabel){
    const parsed = parseM3U(text);
    channels = parsed;
    activeChannel = null;
    renderChannels(els.search.value);
    setHint(`${parsed.length} canali · ${sourceLabel}`);
    try{ localStorage.setItem('iptv_last_source', sourceLabel); }catch(e){}
  }

  function setHint(msg){ els.playlistHint.textContent = msg; }

  // ── Player HLS con auto-restart (watchdog, come nell'app Python) ──
  let watchdogTimer = null;
  let retryCount = 0;
  const MAX_RETRY = 5;

  function clearWatchdog(){
    if (watchdogTimer){ clearTimeout(watchdogTimer); watchdogTimer = null; }
  }

  function playChannel(ch){
    activeChannel = ch;
    renderChannels(els.search.value);
    els.nowPlaying.textContent = ch.name;
    els.nowPlaying.classList.remove('dim');
    els.placeholder.style.display = 'none';
    els.overlay.classList.remove('show');
    els.statusPill.textContent = 'CONNESSIONE…';
    els.liveTag.classList.remove('on');
    retryCount = 0;
    streamCandidates = [ch.url, ...CORS_PROXIES.map(p => p(ch.url))];
    candidateIndex = 0;
    startStream(streamCandidates[0]);
    if (window.innerWidth <= 760) els.sidebar.classList.remove('open');
  }

  let streamCandidates = [];
  let candidateIndex = 0;

  function startStream(url){
    clearWatchdog();
    if (hls){ hls.destroy(); hls = null; }

    const viaProxy = candidateIndex > 0;

    // Stesso ordine dell'esempio noto funzionante: prova prima l'HLS nativo
    // del browser (Safari/iOS), poi hls.js come fallback.
    if (els.video.canPlayType('application/vnd.apple.mpegurl') && !viaProxy){
      els.video.src = url;
      els.video.addEventListener('loadedmetadata', () => {
        els.video.play().catch(() => {});
        els.statusPill.textContent = 'IN RIPRODUZIONE';
        els.liveTag.classList.add('on');
        retryCount = 0;
      }, { once:true });
      els.video.addEventListener('error', () => handleStreamError('Errore riproduzione stream'), { once:true });

    } else if (Hls.isSupported()){
      hls = new Hls({
        liveSyncDurationCount: 3,
        maxBufferLength: 20,
        manifestLoadingMaxRetry: 4,
        levelLoadingMaxRetry: 4,
        fragLoadingMaxRetry: 4,
      });
      hls.loadSource(url);
      hls.attachMedia(els.video);

      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        els.video.play().catch(() => {});
      });

      hls.on(Hls.Events.FRAG_BUFFERED, () => {
        els.statusPill.textContent = 'IN RIPRODUZIONE';
        els.liveTag.classList.add('on');
        retryCount = 0;
      });

      hls.on(Hls.Events.ERROR, (event, data) => {
        if (!data.fatal) return;
        if (data.type === Hls.ErrorTypes.MEDIA_ERROR){
          hls.recoverMediaError();
          return;
        }
        const label = data.type === Hls.ErrorTypes.NETWORK_ERROR
          ? 'Errore di rete sullo stream' : 'Errore riproduzione stream';
        handleStreamError(label);
      });

    } else {
      showOverlay('Il browser non supporta la riproduzione HLS.');
    }

    // watchdog: se non arriva nessun frame entro N secondi, riavvia (come nel player Python)
    watchdogTimer = setTimeout(() => {
      if (els.statusPill.textContent !== 'IN RIPRODUZIONE'){
        handleStreamError('Timeout connessione stream');
      }
    }, 15000);
  }

  // Alcuni stream (es. relinker Rai) funzionano col player nativo (Safari)
  // ma vengono bloccati dal CORS quando hls.js legge il manifest in Chrome/
  // Edge/Firefox. Al primo errore di rete si prova automaticamente la stessa
  // URL passata attraverso una cascata di proxy CORS pubblici, senza che tu
  // debba configurare nulla.
  function handleStreamError(label){
    if (candidateIndex < streamCandidates.length - 1){
      candidateIndex++;
      els.statusPill.textContent = 'RIPROVO CON PROXY…';
      startStream(streamCandidates[candidateIndex]);
      return;
    }
    scheduleRestart(label);
  }

  function scheduleRestart(reason){
    clearWatchdog();
    if (!activeChannel) return;
    retryCount++;
    if (retryCount > MAX_RETRY){
      showOverlay(reason + '.\nTentativi esauriti — riprova manualmente o cambia canale.');
      els.statusPill.textContent = 'ERRORE';
      return;
    }
    showOverlay(`${reason}.\nRiconnessione in corso… (tentativo ${retryCount}/${MAX_RETRY})`);
    els.statusPill.textContent = 'RICONNESSIONE…';
    els.liveTag.classList.remove('on');
    const delay = Math.min(1500 * retryCount, 8000);
    setTimeout(() => {
      if (activeChannel){
        els.overlay.classList.remove('show');
        candidateIndex = 0;
        startStream(streamCandidates[0] || activeChannel.url);
      }
    }, delay);
  }

  function showOverlay(msg){
    els.overlay.textContent = msg;
    els.overlay.classList.add('show');
  }

  // ── eventi UI ───────────────────────────────────────────────────
  els.loadUrlBtn.addEventListener('click', () => {
    const url = els.m3uUrl.value.trim();
    if (url) loadFromUrl(url);
  });
  els.m3uUrl.addEventListener('keydown', e => {
    if (e.key === 'Enter') els.loadUrlBtn.click();
  });
  els.m3uFile.addEventListener('change', e => {
    const file = e.target.files[0];
    if (file) loadFromFile(file);
  });
  els.search.addEventListener('input', () => renderChannels(els.search.value));
  els.menuBtn.addEventListener('click', () => els.sidebar.classList.toggle('open'));

  // ripristina ultimo URL playlist se presente
  try{
    const last = localStorage.getItem('iptv_last_source');
    if (last && /^https?:\/\//i.test(last)){
      els.m3uUrl.value = last;
    }
  }catch(e){}

})();
</script>
</body>
</html>
