name: Aggiorna EPG

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  EPG_URLS: |
    https://iptv-epg.org/files/epg-it.xml
    https://epgshare01.online/epgshare01/epg_ripper_IT1.xml.gz
    https://www.epgitalia.tv/gzip
    https://www.epgitalia.tv/guidexz
    https://www.epgitalia.tv/guide2
    https://www.free-epg.de/api/epg?country=IT
    https://www.open-epg.com/files/italy1.xml.gz
    https://www.open-epg.com/files/italy2.xml.gz
    https://www.open-epg.com/files/italy3.xml.gz
    https://www.open-epg.com/files/italy4.xml.gz
    https://www.open-epg.com/files/italy5.xml.gz
    https://www.open-epg.com/files/italy6.xml.gz
    https://www.open-epg.com/files/italy7.xml.gz
    https://www.open-epg.com/files/italy8.xml.gz

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Scarica tutte le fonti EPG
        shell: bash
        run: |
          set +e
          mkdir -p epg

          ok_count=0
          fail_count=0

          # Extra per gestire EPG multipli dal stesso sito
          declare -A site_counter

          make_filename() {
            local url="$1"
            local domain base_name file_name

            # 1) Estrai dominio completo (es: www.epgitalia.tv, open-epg.com)
            domain=$(printf '%s' "$url" | sed -n 's|^[^/]*\/\/||; s|/[^\?]*||; s|:.*||; p' | head -1)

            # 2) Estrai nome del sito: dopo www. (se presente), prima del .com/.tv/.org/.de/.online
            local site_name
            site_name=$(printf '%s' "$domain" | sed 's|^www\.||; s|\.[a-z0-9-]*$||')

            # 3) Estrai nome file dopo ultimo slash, senza estensione e senza 'xml'
            base_name=$(printf '%s' "$url" | sed -n 's|^[^\?]*\/||; s|\?.*||; p' | head -1)
            # Rimuovi estensione finale (.gz, .xml.gz, .xml)
            file_name=$(printf '%s' "$base_name" | sed 's|\.xml\.gz$||; s|\.gz$||; s|\.xml$||')
            # Rimuovi 'xml' se presente come nome
            file_name=$(printf '%s' "$file_name" | sed 's|xml||g; s|_*$||')

            # 4) Se ci sono già EPG da questo sito, aggiungi _ + file_name
            if [ -n "${site_counter[$site_name]}" ] && [ "${site_counter[$site_name]}" -gt 0 ]; then
              printf '%s_%s\n' "$site_name" "$file_name"
            else
              printf '%s\n' "$site_name"
            fi

            site_counter[$site_name]=$((${site_counter[$site_name]:-0} + 1))
          }

          USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          while IFS= read -r url; do
            [ -z "$url" ] && continue

            echo "----------------------------------------"
            echo "Fonte: $url"

            short_name=$(make_filename "$url")
            outfile="epg/${short_name}.gz"
            tmpfile="${outfile}.tmp"

            rm -f "$tmpfile"

            curl -L \
              --max-time 180 \
              -A "$USER_AGENT" \
              "$url" -o "$tmpfile"

            if [ ! -s "$tmpfile" ]; then
              echo "Download fallito o vuoto: $url"
              rm -f "$tmpfile"
              fail_count=$((fail_count + 1))
              continue
            fi

            if file "$tmpfile" | grep -qi 'gzip'; then
              mv -f "$tmpfile" "$outfile"
            else
              gzip -c "$tmpfile" > "$outfile"
              rm -f "$tmpfile"
            fi

            echo "Salvato: $outfile ($(wc -c < "$outfile") bytes)"
            ok_count=$((ok_count + 1))
          done <<< "$EPG_URLS"

          echo "EPG_OK_COUNT=$ok_count" >> "$GITHUB_ENV"
          echo "EPG_FAIL_COUNT=$fail_count" >> "$GITHUB_ENV"

      - name: Commit e push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add epg/*.gz 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Nessuna modifica EPG"
          else
            git commit -m "EPG aggiornato $(date -u '+%Y-%m-%d %H:%M UTC') [OK=$EPG_OK_COUNT FAIL=$EPG_FAIL_COUNT]"
            git push
          fi
