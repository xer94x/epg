name: Aggiorna EPG

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  EPG_URLS: |
    https://iptv-epg.org/files/epg-it.xml
    https://epgshare01.online/epgshare01/epg_ripper_IT1.xml.gz
    https://www.epgitalia.tv/gzip
    https://www.epgitalia.tv/guidexz
    https://www.epgitalia.tv/guide2
    http://epg-guide.com/it.gz
    https://www.free-epg.de/api/epg?country=IT
    https://www.open-epg.com/files/italy1.xml.gz
    https://www.open-epg.com/files/italy2.xml.gz
    https://www.open-epg.com/files/italy3.xml.gz
    https://www.open-epg.com/files/italy4.xml.gz
    https://www.open-epg.com/files/italy5.xml.gz
    https://www.open-epg.com/files/italy6.xml.gz
    https://www.open-epg.com/files/italy7.xml.gz
    https://www.open-epg.com/files/italy8.xml.gz

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Scarica tutte le fonti EPG
        shell: bash
        run: |
          set +e
          mkdir -p epg

          ok_count=0
          fail_count=0

          make_filename() {
            local url="$1"
            local domain site_name base_name file_name

            # Rimuove la query string prima di tutto
            local url_noquery="${url%%\?*}"

            domain=$(printf '%s' "$url_noquery" | sed -n 's|^[^/]*\/\/||; s|/[^\?]*||; s|:.*||; p' | head -1)
            site_name=$(printf '%s' "$domain" | sed 's|^www\.||; s|\.[a-z0-9-]*$||')

            base_name=$(printf '%s' "$url_noquery" | sed -n 's|^[^\?]*\/||; s|\?.*||; p' | head -1)
            file_name=$(printf '%s' "$base_name" | sed 's|\.xml\.gz$||; s|\.gz$||; s|\.xml$||')
            file_name=$(printf '%s' "$file_name" | sed 's|xml||g; s|_*$||')

            # Aggiunge il filename al site_name se è presente e diverso
            if [ -n "$file_name" ] && [ "$file_name" != "$site_name" ]; then
              printf '%s_%s\n' "$site_name" "$file_name"
            else
              printf '%s\n' "$site_name"
            fi
          }

          download_url() {
            local url="$1"
            local outfile="$2"
            local max_retries=3
            local attempt=0
            local tmpfile="${outfile}.tmp"

            # UA diverso garantito per ogni tentativo
            local UA0="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
            local UA1="Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:125.0) Gecko/20100101 Firefox/125.0"
            local UA2="Mozilla/5.0 (Macintosh; Intel Mac OS X 14_4_1) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.4.1 Safari/605.1.15"

            local REF0="https://www.google.it/"
            local REF1="https://duckduckgo.com/"
            local REF2="https://www.bing.com/"

            while [ $attempt -lt $max_retries ]; do
              local ua_var="UA${attempt}"
              local ref_var="REF${attempt}"
              local ua="${!ua_var}"
              local referer="${!ref_var}"

              attempt=$((attempt + 1))
              echo "  Tentativo $attempt/$max_retries — UA: ${ua:0:60}..."

              rm -f "$tmpfile"

              curl -L \
                --max-time 15 \
                --connect-timeout 8 \
                -A "$ua" \
                -H "Referer: $referer" \
                -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
                -H "Accept-Language: it-IT,it;q=0.9,en-US;q=0.8,en;q=0.7" \
                -H "Accept-Encoding: gzip, deflate, br" \
                -H "DNT: 1" \
                -H "Connection: keep-alive" \
                "$url" -o "$tmpfile" 2>/dev/null

              if [ -s "$tmpfile" ]; then
                if file "$tmpfile" | grep -qi 'gzip'; then
                  mv -f "$tmpfile" "$outfile"
                else
                  gzip -c "$tmpfile" > "$outfile"
                  rm -f "$tmpfile"
                fi
                echo "  OK: $outfile ($(wc -c < "$outfile") bytes)"
                return 0
              fi

              rm -f "$tmpfile"
              echo "  Fallito, attendo prima del prossimo tentativo..."
              [ $attempt -lt $max_retries ] && sleep 5
            done

            echo "  FALLITO dopo $max_retries tentativi: $url"
            return 1
          }

          while IFS= read -r url; do
            [ -z "$url" ] && continue

            echo "----------------------------------------"
            echo "Fonte: $url"

            short_name=$(make_filename "$url")
            outfile="epg/${short_name}.gz"

            if download_url "$url" "$outfile"; then
              ok_count=$((ok_count + 1))
            else
              fail_count=$((fail_count + 1))
            fi
          done <<< "$EPG_URLS"

          echo "EPG_OK_COUNT=$ok_count" >> "$GITHUB_ENV"
          echo "EPG_FAIL_COUNT=$fail_count" >> "$GITHUB_ENV"

      - name: Commit e push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add epg/*.gz 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Nessuna modifica EPG"
          else
            git commit -m "EPG aggiornato $(date -u '+%Y-%m-%d %H:%M UTC') [OK=$EPG_OK_COUNT FAIL=$EPG_FAIL_COUNT]"
            git push
          fi
