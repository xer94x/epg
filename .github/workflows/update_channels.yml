name: Aggiorna palinsesti canali

on:
  schedule:
    - cron: "17 5,11 * * *"   # due volte al giorno, a 6 ore di distanza; ogni esecuzione scarica max 10 canali (i piu' vecchi)
  workflow_dispatch:
    inputs:
      force:
        description: "Ignora every_days (resta il tetto di canali per esecuzione)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4

      - name: Scarica i palinsesti
        id: scrape
        continue-on-error: true
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python scrape_channels.py --out channel_matches.json --force
          else
            python scrape_channels.py --out channel_matches.json
          fi

      - name: Commit se cambiato
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add channel_matches.json
          git diff --cached --quiet || (git commit -m "Aggiorna channel_matches.json" && git push)

      - name: Segna il job rosso se c'e' stato un errore
        if: steps.scrape.outcome == 'failure'
        run: exit 1
