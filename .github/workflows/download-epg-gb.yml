name: Download EPG-GB
 
on:
  schedule:
     - cron: "*/15 * * * *"   # ogni 15 minuti, 24 ore su 24
  workflow_dispatch: {}  # permette di lanciarlo anche manualmente da GitHub
 
permissions:
  contents: write
 
jobs:
  download-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
 
      - name: Scarica EPG
        run: |
          mkdir -p epg
          curl -fSL --retry 3 --retry-delay 5 \
            -o epg/epg-gb.xml \
            https://iptv-epg.org/files/epg-gb.xml
 
      - name: Verifica che il file non sia vuoto
        run: |
          if [ ! -s epg/epg-gb.xml ]; then
            echo "File scaricato vuoto o mancante!"
            exit 1
          fi
 
      - name: Commit e push se ci sono cambiamenti
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add epg/epg-gb.xml
          if git diff --cached --quiet; then
            echo "Nessuna modifica, salto il commit."
          else
            git commit -m "Aggiornamento automatico EPG $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
