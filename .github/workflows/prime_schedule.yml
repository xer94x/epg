name: Aggiorna palinsesto Prime Video

on:
  schedule:
    - cron: "17 5 * * *"      # una volta al giorno (05:17 UTC)
  workflow_dispatch: {}        # lancio manuale dal tab Actions

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scrape_prime.py --out prime_matches.json
      - name: Commit se cambiato
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prime_matches.json
          git diff --cached --quiet || (git commit -m "Aggiorna prime_matches.json" && git push)
